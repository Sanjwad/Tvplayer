name: Deploy sync service

# Uploads sync-worker/ to Cloudflare. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, stalker]
    paths: ["sync-worker/**", ".github/workflows/sync-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets preferred; plain repository variables of the same name also work.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          [ -z "$CF_TOKEN" ] && echo "::warning::CLOUDFLARE_API_TOKEN is missing"
          [ -z "$CF_ACCOUNT" ] && echo "::warning::CLOUDFLARE_ACCOUNT_ID is missing"
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "SKIP=1" >> $GITHUB_ENV
          fi
      - name: Find or create the KV store
        if: env.SKIP != '1'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          id=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=100" | jq -r '.result[] | select(.title=="sanjtv-sync") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"title":"sanjtv-sync"}' "$api" | jq -r '.result.id')
          fi
          echo "KV id: $id"
          sed -i "s/__KV_ID__/$id/" sync-worker/wrangler.toml
      - name: Make sure the account has a workers.dev address
        if: env.SKIP != '1'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          sub=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            want="sanjtv-$(echo "$CF_ACCOUNT" | cut -c1-6)"
            echo "No workers.dev address yet; creating $want"
            curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$want\"}" "$api" | jq -c '{success, errors}'
            sub=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          fi
          echo "workers.dev address: $sub"
          echo "SUB=$sub" >> $GITHUB_ENV
      - name: Deploy
        if: env.SKIP != '1'
        working-directory: sync-worker
        run: npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; exit ${PIPESTATUS[0]}
      - name: Show address
        if: env.SKIP != '1'
        run: |
          url="https://sanjtv-sync.$SUB.workers.dev"
          echo "SYNC_URL=$url"
          ok=0; for i in 1 2 3 4 5 6; do curl -fsS "$url/" && echo && ok=1 && break; sleep 10; done
          [ $ok = 1 ] || { echo "::warning::not answering yet (new addresses can take a minute)"; exit 0; }
          # Save and read back a test document under a throwaway key.
          k=$(head -c 32 /dev/urandom | sha256sum | cut -c1-64)
          curl -fsS -X PUT -H "Content-Type: application/json" --data '{"v":1,"items":{"test":1}}' "$url/v1/$k" && echo
          got=$(curl -fsS "$url/v1/$k"); echo "read back: $got"
          [ "$got" = '{"v":1,"items":{"test":1}}' ] && echo "SYNC TEST PASSED" || { echo "::error::sync test failed"; exit 1; }
