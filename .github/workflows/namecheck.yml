name: Name check
on: { push: { branches: [namecheck] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look up domains (RDAP; 404 = not registered)
        run: |
          names="mapletv maplestream truenorthtv toquetv tuquetv loonietv chinooktv muskokatv timbertv birchtv sprucetv klondiketv rideautv kayaktv cottagetv northstreamtv polartv cariboutv maplecast northernplay"
          url() { case $2 in com) echo "https://rdap.verisign.com/com/v1/domain/$1.com";;
                  app) echo "https://pubapi.registry.google/rdap/domain/$1.app";; ca) echo "https://rdap.ca.fury.ca/rdap/domain/$1.ca";; esac; }
          for n in $names; do
            for tld in com app ca; do
              c=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$(url $n $tld)" || true)
              [ "$c" = "404" ] && s="FREE" || { [ "$c" = "200" ] && s="taken" || s="?($c)"; }
              printf "%-18s %s\n" "$n.$tld" "$s"
              sleep 0.4
            done
          done
