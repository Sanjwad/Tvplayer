name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvplayer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tvplayer.apk \
            --title "Sanj TV build ${{ github.run_number }}" \
            --notes "Version 0.1.${{ github.run_number }}" \
            --target "${{ github.sha }}" --latest
