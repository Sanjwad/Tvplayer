name: Build APK

on:
  push:
    branches: [main, stalker]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

# A newer push replaces a build still running for the same branch, instead of two builds
# racing to publish the same release (that race was what sent the "failed" emails).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        shell: bash
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          OPENSUBS_KEY: ${{ secrets.OPENSUBS_KEY }}
          # Anything but main builds "Sanj TV Test", which installs beside Sanj TV.
          SANJ_TEST: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > errors.txt || true
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog build.log errors.txt --title "Last failed build log" --notes "Run ${{ github.run_number }}" --prerelease --target "${{ github.sha }}"

      - name: Publish as "latest" release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvplayer.apk
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}"}' > version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tvplayer.apk version.json \
            --title "Sanj TV build ${{ github.run_number }}" \
            --notes "Version 0.1.${{ github.run_number }}" \
            --target "${{ github.sha }}" --latest

      - name: Publish test build (never touches "latest")
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tvplayer.apk
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}-test"}' > version.json
          gh release delete stalker-test --yes --cleanup-tag || true
          gh release create stalker-test tvplayer.apk version.json \
            --title "Sanj TV Test build ${{ github.run_number }}" \
            --notes "Test build from ${{ github.ref_name }}. Installs beside Sanj TV." \
            --target "${{ github.sha }}" --prerelease --latest=false
