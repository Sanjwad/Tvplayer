name = "chinooktv-site"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

routes = [
  { pattern = "chinooktv.com", custom_domain = true },
  { pattern = "www.chinooktv.com", custom_domain = true },
  { pattern = "chinooktv.ca", custom_domain = true },
  { pattern = "www.chinooktv.ca", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "ACCOUNTS"
id = "__ACCOUNTS_KV_ID__"
